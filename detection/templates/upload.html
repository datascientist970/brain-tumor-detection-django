<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Prediction System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e9f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            color: #1e3c72;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom:10px;
            width: 100%; /* Ensure the title takes up the full width for better centering */
        }
        .upload-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;

        }
        .upload-container h2 {
            color: #1e3c72;
            font-size: 1.8em;
            font-weight: 500;
            margin-bottom: 30px;
        }
        .form-group label {
            font-size: 1.2em;
            color: #4a4a4a;
            cursor: pointer;
        }
        .form-control-file {
            border: 2px solid #1e3c72;
            border-radius: 10px;
            padding: 10px;
            background-color: #f7f7f7;
            transition: all 0.3s ease;
        }
        .form-control-file:focus {
            border-color: #1e3c72;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(30, 60, 114, 0.3);
        }
        .btn-primary {
            background-color: #1e3c72;
            border-color: #1e3c72;
            padding: 10px 20px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0f2a48;
            border-color: #0f2a48;
        }
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 1em;
            color: #4a4a4a;
        }
    </style>
</head>
<body>
    <h1>BRAIN TUMOR DETECTION SYSTEM</h1>
    <div class="upload-container">
        <h2>Upload an Image for Prediction</h2>
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="image">Choose Image</label>
                <input type="file" class="form-control-file" id="image" name="image" required>
            </div>
            <button type="submit" class="btn btn-primary"><strong>Generate Report</strong></button>
        </form>
    </div>
    <footer>
        <p>&copy; 2025 Brain Tumor Detection System. All Rights Reserved.</p>
    </footer>
</body>
</html>
